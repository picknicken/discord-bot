<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Bot — dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --panel: #ffffff; --line: #e2e4e9; --text: #1c1e22; --muted: #6b7280;
    --accent: #5865f2; --ok: #2f9e5f; --warn: #c98a00; --bad: #d63c41; --code: #f0f1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --panel: #1f2126; --line: #2e3138; --text: #e7e9ee; --muted: #9aa1ad;
      --accent: #7d87f7; --ok: #4ec27c; --warn: #e0a52b; --bad: #ef5d62; --code: #16171b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  header img { width: 32px; height: 32px; border-radius: 50%; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .panel > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600;
  }
  .panel > .body { padding: 12px 14px; }
  .item {
    display: block; width: 100%; text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; cursor: pointer; font: inherit;
  }
  .item:hover { background: var(--code); }
  .item[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
  .item strong { display: block; }
  .item small { color: var(--muted); }
  button, select, input[type="text"], textarea {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }
  label.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  textarea {
    width: 100%; min-height: 420px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px; background: var(--code); resize: vertical; tab-size: 2;
  }
  .tabs { display: flex; gap: 4px; padding: 8px 14px 0; }
  .tabs button { border-radius: 7px 7px 0 0; border-bottom-color: transparent; }
  .tabs button[aria-selected="true"] { background: var(--code); border-color: var(--line); border-bottom-color: var(--code); font-weight: 600; }
  .note { padding: 8px 10px; border-radius: 7px; font-size: 13px; }
  .note.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .note.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); white-space: pre-wrap; }
  .note.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .muted { color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    background: var(--code); font-size: 12px; margin: 0 6px 6px 0;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .cat { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  .cat > h3 { margin: 0; padding: 8px 12px; font-size: 13px; background: var(--code); border-radius: 7px 7px 0 0; }
  .cat ul { list-style: none; margin: 0; padding: 6px 12px 10px; }
  .cat li { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .cat li .type { color: var(--muted); font-size: 11px; min-width: 78px; }
  pre.actions {
    background: var(--code); padding: 10px 12px; border-radius: 7px; max-height: 320px; overflow: auto;
    font-size: 12.5px; margin: 10px 0 0; white-space: pre-wrap;
  }
  .add { color: var(--ok); } .del { color: var(--bad); } .mod { color: var(--warn); }
  .finding { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .finding:last-child { border-bottom: 0; }
  .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; min-width: 62px; letter-spacing: .04em; }
  .sev.error { color: var(--bad); } .sev.warning { color: var(--warn); } .sev.info { color: var(--muted); }
  .finding .where { color: var(--muted); font-size: 12px; }
  .vis { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  .vis .eye { min-width: 16px; }
  .vis.off { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .vis .why { font-size: 11px; color: var(--muted); }
  .counts { display: flex; gap: 14px; margin-bottom: 10px; }
  .counts b { font-size: 18px; display: block; line-height: 1.2; }
  button.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; font-size: 12px; }
  .guildrow { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .guildrow:last-child { border-bottom: 0; }
  .guildrow .meta { font-size: 11px; color: var(--muted); }
  .guildrow .bad { color: var(--bad); }
  .guildrow .warn { color: var(--warn); }
  .backup { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .backup:last-child { border-bottom: 0; }

  /* editor */
  .editor { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .editor { grid-template-columns: 1fr; } }
  .tree ul { list-style: none; margin: 0 0 10px; padding: 0; }
  .tree .group > ul { margin: 0 0 8px 10px; border-left: 1px solid var(--line); padding-left: 6px; }
  .treehead { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 4px; }
  .treehead h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .treehead button { padding: 2px 8px; font-size: 12px; }
  .hint { color: var(--muted); font-size: 11px; margin: 0 0 6px; }
  .node { display: flex; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  .node:hover { background: var(--code); }
  .node.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .node .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .tools { display: none; gap: 2px; }
  .node:hover .tools, .node.on .tools { display: flex; }
  .node .tools button { padding: 0 5px; font-size: 11px; line-height: 1.6; }
  .props h3 { margin: 0 0 10px; font-size: 14px; }
  .props h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .field { display: block; margin-bottom: 10px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field input[type="text"], .field input[type="number"], .field select { width: 100%; }
  .field input[type="color"] { width: 56px; height: 30px; padding: 2px; }
  .perms { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; padding: 6px 0; }
  .perms .check { font-size: 12.5px; }
  details > summary { cursor: pointer; padding: 5px 0; font-size: 13px; }
  .matrixwrap { overflow-x: auto; margin-top: 6px; }
  table.matrix { border-collapse: collapse; font-size: 12px; }
  table.matrix th { font-weight: 500; padding: 3px 4px; white-space: nowrap; text-align: center; }
  table.matrix tr > th:first-child { color: var(--muted); text-align: left; padding-right: 10px; }
  table.matrix td { padding: 1px 4px; text-align: center; }
  button.tri { width: 30px; padding: 2px 0; text-align: center; font-size: 12px; }
  button.tri.s1 { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  button.tri.sneg { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  button.tri.s0 { color: var(--muted); }
  .msg { margin-bottom: 8px; }
  .msg textarea { min-height: 0; }
</style>
</head>
<body>
<header>
  <img id="avatar" alt="">
  <div>
    <h1 id="botName">Dashboard laden…</h1>
    <div class="sub" id="botSub"></div>
  </div>
</header>

<div class="grid">
  <section class="panel">
    <h2>Templates</h2>
    <div id="templateList"></div>
    <div class="body">
      <div class="row">
        <button id="newTemplate">Nieuw</button>
        <button id="dupTemplate" disabled>Dupliceren</button>
        <button id="delTemplate" class="danger" disabled>Verwijderen</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2 id="editorTitle">Geen template gekozen</h2>
    <div class="tabs">
      <button id="tabTree" aria-selected="true">Structuur</button>
      <button id="tabJson" aria-selected="false">JSON</button>
      <button id="tabCheck" aria-selected="false">Controle</button>
    </div>
    <div class="body">
      <div id="treeView"><p class="muted">Kies links een template.</p></div>
      <div id="checkView" hidden>
        <div class="row" style="margin-bottom:12px">
          <button id="runCheck" class="primary">Controleer</button>
          <span class="muted">werkt op wat er nu in de editor staat</span>
        </div>
        <div id="checkResult"></div>
      </div>
      <div id="jsonView" hidden>
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="row">
          <button id="save" class="primary">Opslaan</button>
          <button id="revert">Herstellen</button>
          <select id="versions" title="Eerdere versies"></select>
          <span id="saveNote" class="muted"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Toepassen</h2>
    <div class="body">
      <div id="guildList"></div>
      <div class="row" style="margin-top:6px">
        <button id="allGuilds" class="link">Alles</button>
        <button id="noGuilds" class="link">Niets</button>
      </div>

      <div class="row" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="update" checked>
          <span>Bestaande rollen en kanalen bijwerken</span></label>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="prune">
          <span>Kanalen verwijderen die niet in de template staan
            <br><small class="muted">Onomkeerbaar. Vraagt om bevestiging.</small></span></label>
      </div>

      <div class="row" style="margin-top:12px">
        <button id="preview">Preview</button>
        <button id="apply" class="primary">Toepassen</button>
      </div>

      <div id="planResult"></div>

      <div class="row" style="margin-top:16px; border-top:1px solid var(--line); padding-top:12px">
        <button id="exportGuild">Server opslaan als template</button>
      </div>

      <details style="margin-top:14px">
        <summary class="muted" style="cursor:pointer">Back-ups</summary>
        <p class="muted" style="font-size:12px;margin:8px 0">
          Voor elk toepassen wordt de structuur van de server weggeschreven. Terugzetten vult
          aan en werkt bij — verwijderde kanalen en hun berichten komen niet terug.
        </p>
        <div id="backupList"></div>
      </details>
    </div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
