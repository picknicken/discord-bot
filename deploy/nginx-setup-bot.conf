# Setup Bot achter nginx, op een eigen subdomein.
#
# Een subdomein en geen /setup/-pad: de dashboardpagina laadt zijn scripts en de
# API op absolute paden (/api, /auth, /app.js), dus onder een subpad zou hij
# botsen met de routes van de bot.
#
#   sudo cp deploy/nginx-setup-bot.conf /etc/nginx/sites-available/setup-bot
#   sudo ln -s /etc/nginx/sites-available/setup-bot /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d setup.jouwdomein.nl
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name setup.jouwdomein.nl;

    # certbot zet hier de redirect naar https neer.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name setup.jouwdomein.nl;

    # ssl_certificate / ssl_certificate_key worden door certbot ingevuld.

    # Het dashboard luistert alleen op localhost; nginx is de enige weg naar binnen.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Het toepassen van een grote template kan even duren.
        proxy_read_timeout 300s;
    }

    # Het logo is 1,2 MB; laat de browser hem bewaren.
    location = /logo.png {
        proxy_pass http://127.0.0.1:4000;
        expires 1h;
    }
}
