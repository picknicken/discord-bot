# Een server inrichten zonder computer: start deze workflow vanaf je telefoon
# (GitHub -> Actions -> Server inrichten -> Run workflow).
#
# Vooraf eenmalig, onder Settings -> Secrets and variables -> Actions:
#   DISCORD_TOKEN      de token van je bot
#   DISCORD_CLIENT_ID  het Application ID
#
# Zonder "apply" te kiezen verandert er niets: dan zie je alleen het plan.
name: Server inrichten

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: 'Server-id (Discord -> rechtermuisknop op de server -> ID kopieren)'
        required: true
        type: string
      template:
        description: 'Welke template'
        required: true
        default: community
        type: choice
        options: [community, gaming, bedrijf]
      mode:
        description: 'preview laat alleen zien wat er zou gebeuren'
        required: true
        default: preview
        type: choice
        options: [preview, apply]
      prune:
        description: 'Kanalen verwijderen die niet in de template staan (onomkeerbaar)'
        required: false
        default: false
        type: boolean
      onderdelen:
        description: 'Welke delen: alles, of bijv. rollen,kanalen (rollen categorieen kanalen automod emojis instellingen onboarding)'
        required: false
        default: alles
        type: string
      variabelen:
        description: 'Waarden voor {{variabelen}} in de template, bijv: server_naam=Mijn Clan, kleur=#ff0000'
        required: false
        default: ''
        type: string
      stop_bij_tekort:
        description: 'Stoppen zodra de bot iets niet mag (standaard doet hij wat wel kan en zegt hij de rest)'
        required: false
        default: false
        type: boolean

jobs:
  inrichten:
    name: ${{ inputs.mode }} ${{ inputs.template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      # Een opdracht kan uren in de wachtrij blijven staan. Gaat hij daarna
      # alsnog lopen, dan wordt er een server ingericht op een moment dat
      # niemand verwacht - en met prune aan verdwijnen er zelfs kanalen. Een
      # preview mag wel: die verandert niets.
      - name: Weiger een opdracht die is blijven hangen
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_MINUTEN: '30'
        run: |
          aangevraagd=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          wachttijd=$(( ($(date -u +%s) - $(date -u -d "$aangevraagd" +%s)) / 60 ))

          echo "Aangevraagd op $aangevraagd; dat is $wachttijd minuten geleden."
          if [ "$wachttijd" -gt "$MAX_MINUTEN" ]; then
            echo "::error::Deze opdracht staat al $wachttijd minuten in de wachtrij (maximum $MAX_MINUTEN). Er is niets gewijzigd. Start hem opnieuw als je dit nog wilt."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Controleer of de secrets ingesteld zijn
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          if [ -z "$DISCORD_TOKEN" ] || [ -z "$DISCORD_CLIENT_ID" ]; then
            echo "::error::Zet DISCORD_TOKEN en DISCORD_CLIENT_ID onder Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Template uitvoeren
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          # Via de omgeving, niet in de commandoregel: invoer hoort nooit
          # rechtstreeks in een shell-commando terecht te komen.
          GUILD_ID: ${{ inputs.guild_id }}
          TEMPLATE: ${{ inputs.template }}
          MODE: ${{ inputs.mode }}
          PRUNE: ${{ inputs.prune }}
          STOP_BIJ_TEKORT: ${{ inputs.stop_bij_tekort }}
          ONDERDELEN: ${{ inputs.onderdelen }}
          VARIABELEN: ${{ inputs.variabelen }}
        run: |
          args=(--guild "$GUILD_ID" --template "$TEMPLATE" --alleen "${ONDERDELEN:-alles}")
          [ -z "$VARIABELEN" ] || args+=(--var "$VARIABELEN")
          if [ "$MODE" = "apply" ]; then
            args+=(--apply)
            if [ "$PRUNE" = "true" ]; then
              args+=(--prune)
              echo "::warning::prune staat aan — kanalen buiten de template worden verwijderd."
            fi
            if [ "$STOP_BIJ_TEKORT" = "true" ]; then
              args+=(--stop-bij-tekort)
            fi
          fi
          node dist/apply-once.js "${args[@]}"
