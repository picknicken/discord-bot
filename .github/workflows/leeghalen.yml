# Een testserver leeghalen. Aparte workflow met opzet: dit is de enige knop hier
# die dingen weggooit, en die hoort niet naast "inrichten" te staan waar je hem
# per ongeluk aantikt.
#
# Deze heette eerst "Server leeghalen", in server-leeghalen.yml. Die versie had
# een run die bij GitHub bleef hangen: niet te starten, niet te annuleren, en hij
# blokkeerde de knop om een nieuwe te starten. Een workflow hoort bij zijn
# bestandsnaam, dus een nieuwe bestandsnaam geeft een schone lijst.
#
# Er gaat altijd eerst een momentopname van de structuur naar de artifacts van
# deze run; die kun je downloaden en later weer toepassen.
name: Leeghalen

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: 'Server-id van de server die leeg moet'
        required: true
        type: string
      bevestig:
        description: 'Typ de naam van die server exact over'
        required: true
        type: string
      rollen_verwijderen:
        description: 'Ook de rollen verwijderen'
        required: false
        default: true
        type: boolean
      kanalen_verwijderen:
        description: 'Ook de kanalen verwijderen'
        required: false
        default: true
        type: boolean
      rollen_behouden:
        description: 'Rollen die hoe dan ook blijven staan, gescheiden door komma. Bijv: Admin, Moderator'
        required: false
        default: ''
        type: string
      automod_verwijderen:
        description: 'Ook de AutoMod-regels verwijderen'
        required: false
        default: true
        type: boolean

jobs:
  leeghalen:
    name: leeghalen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      # Een opdracht kan uren in de wachtrij blijven staan - GitHub krijgt hem
      # soms niet opgestart en cancelen lukt dan ook niet. Gaat hij daarna
      # alsnog lopen, dan haalt hij een server leeg waar je niet meer op zit te
      # wachten. Dus: te oud is niet meer geldig.
      - name: Weiger een opdracht die is blijven hangen
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_MINUTEN: '30'
        run: |
          aangevraagd=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          wachttijd=$(( ($(date -u +%s) - $(date -u -d "$aangevraagd" +%s)) / 60 ))

          echo "Aangevraagd op $aangevraagd; dat is $wachttijd minuten geleden."
          if [ "$wachttijd" -gt "$MAX_MINUTEN" ]; then
            echo "::error::Deze opdracht staat al $wachttijd minuten in de wachtrij (maximum $MAX_MINUTEN). Er is niets verwijderd. Start hem opnieuw als je dit nog wilt."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Controleer of de secrets ingesteld zijn
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          if [ -z "$DISCORD_TOKEN" ] || [ -z "$DISCORD_CLIENT_ID" ]; then
            echo "::error::Zet DISCORD_TOKEN en DISCORD_CLIENT_ID onder Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Leeghalen
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GUILD_ID: ${{ inputs.guild_id }}
          BEVESTIG: ${{ inputs.bevestig }}
          ROLLEN: ${{ inputs.rollen_verwijderen }}
          KANALEN: ${{ inputs.kanalen_verwijderen }}
          AUTOMOD: ${{ inputs.automod_verwijderen }}
          BEHOUD_ROLLEN: ${{ inputs.rollen_behouden }}
        run: |
          args=(--guild "$GUILD_ID" --bevestig "$BEVESTIG")
          [ -z "$BEHOUD_ROLLEN" ] || args+=(--behoud-rol "$BEHOUD_ROLLEN")
          [ "$ROLLEN" = "true" ]  || args+=(--behoud-rollen)
          [ "$KANALEN" = "true" ] || args+=(--behoud-kanalen)
          [ "$AUTOMOD" = "true" ] || args+=(--behoud-automod)
          if [ "$ROLLEN$KANALEN$AUTOMOD" = "falsefalsefalse" ]; then
            echo "::error::Niets aangevinkt — er valt zo niets leeg te halen."
            exit 1
          fi
          node dist/reset-once.js "${args[@]}"

      - name: Momentopname bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: momentopname-voor-leeghalen
          path: backups/*.json
          if-no-files-found: ignore
          retention-days: 30
